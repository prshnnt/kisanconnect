services:
  db:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: kisanconnect }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, retries: 10 }
  redis:
    image: redis:7
  migrate:                      # schema changes run as a job, never at app start
    build: .
    command: alembic upgrade head
    env_file: .env
    depends_on: { db: { condition: service_healthy } }
  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    depends_on: { migrate: { condition: service_completed_successfully } }
  worker:
    build: .
    command: celery -A app.tasks.celery_app.celery worker -l info
    env_file: .env
    depends_on: [redis, migrate]
  beat:
    build: .
    command: celery -A app.tasks.celery_app.celery beat -l info -s /tmp/celerybeat-schedule
    env_file: .env
    depends_on: [redis]
volumes: { pgdata: {} }
