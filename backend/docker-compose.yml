# Works on a fresh checkout with no setup:   docker compose up --build
# Every service shares the DEVELOPMENT defaults below. For a real deployment set ENV=production, a strong JWT_SECRET,
# DEBUG_OTP=false and real CORS origins (the app refuses to boot in production with weak settings). See README.md.

x-app-env: &app-env
  DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/kisanconnect
  REDIS_URL: redis://redis:6379/0
  ENV: development
  JWT_SECRET: dev-only-secret-change-me-before-deploying-0123456789
  DEBUG_OTP: "true"            # returns OTPs in API responses, because nothing sends SMS yet
  ADMIN_INVITE_CODE: dev-admin-invite
  CORS_ORIGINS: '["http://localhost:3000"]'

services:
  db:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: kisanconnect }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, retries: 10 }

  redis:
    image: redis:7

  migrate:                     # schema changes run as a job, never at app start
    build: .
    command: alembic upgrade head
    environment: *app-env
    depends_on: { db: { condition: service_healthy } }

  api:
    build: .
    environment: *app-env
    ports: ["8000:8000"]
    depends_on: { migrate: { condition: service_completed_successfully } }

  worker:
    build: .
    command: celery -A app.tasks.celery_app.celery worker -l info
    environment: *app-env
    depends_on: [redis, migrate]

  beat:
    build: .
    # the container user cannot write to /srv, so keep beat's schedule file in /tmp
    command: celery -A app.tasks.celery_app.celery beat -l info -s /tmp/celerybeat-schedule
    environment: *app-env
    depends_on: [redis]

volumes: { pgdata: {} }
