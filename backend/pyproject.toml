[project]
name = "kisanconnect-backend"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "email-validator>=2.1",
  "python-jose[cryptography]>=3.3",
  "argon2-cffi>=23.1",
  "python-multipart>=0.0.9",
  "celery>=5.4",
  "redis>=5.0",
  "openpyxl>=3.1",
  "pillow>=10.3",
  "deepagents>=0.7.15",
  "dotenv>=0.9.9",
  "langchain-ollama>=1.1.0",
  "langchain-community>=0.4.2",
  "langgraph-checkpoint-redis>=0.5.2",
  "tavily>=1.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "pgserver>=0.1.4", "psycopg2-binary>=2.9", "ruff>=0.5"]

[tool.ruff]
line-length = 140
[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "E731", "B008"]   # B008: FastAPI's Depends() in defaults is the intended pattern
